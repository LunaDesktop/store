# Luna Store — repozytoria, menedżery pakietów i polecane aplikacje.
#
# Ten plik jest wczytywany przy starcie. Kolejność wyszukiwania:
#   1. $LUNA_STORE_CONFIG
#   2. ~/.config/luna/store/repositories.conf
#   3. /etc/luna/store/repositories.conf
#   4. $XDG_DATA_HOME/luna/store/repositories.conf (~/.local/share/...)
#   5. /usr/share/luna/store/repositories.conf (lub inny katalog z $XDG_DATA_DIRS)
#   6. wartości wbudowane w binarkę (ten sam format)
#
# `enabled = auto` oznacza: włącz repozytorium tylko wtedy, gdy menedżer pakietów
# jest dostępny w PATH (albo gdy istnieje program z `probe`). Dzięki temu jeden
# plik obsługuje różne dystrybucje bez ręcznego przełączania.

[store]
# Jak często odświeżać katalogi w tle (minuty). Cache i tak daje natychmiastowy start.
refresh_minutes = 60
# auto | pkexec | sudo | none — podnoszenie uprawnień przy instalacji/usuwaniu.
# auto = pkexec (okno hasła rysuje agent polkit, np. luna-polkit);
# sudo = sudo -n (tylko dla skonfigurowanego NOPASSWD, bez okna hasła).
privilege = auto
# Kolejne pola to wystarczające fragmenty nazw/identyfikatorów pakietów.
featured = firefox, chromium, gimp, inkscape, blender, vlc, libreoffice, thunderbird, telegram, obs, visual studio code, steam, spotify

# ── PaganOS ───────────────────────────────────────────────────────────────────
[repository.pagan]
name = PaganOS
backend = pag
enabled = auto

# ── Arch Linux / Manjaro ──────────────────────────────────────────────────────
[repository.arch]
name = Arch Linux
backend = pacman
enabled = auto

# ── Debian / Ubuntu ───────────────────────────────────────────────────────────
[repository.debian]
name = Debian / Ubuntu
backend = apt
enabled = auto

# ── Fedora / RHEL ─────────────────────────────────────────────────────────────
[repository.fedora]
name = Fedora
backend = dnf
enabled = auto

# ── Gentoo ────────────────────────────────────────────────────────────────────
[repository.gentoo]
name = Gentoo
backend = emerge
enabled = auto

# ── Flathub (działa na każdej dystrybucji z Flatpakiem) ───────────────────────
[repository.flathub]
name = Flathub
backend = flatpak
remote = flathub
enabled = auto
# installation = system   # odkomentuj, aby zawsze instalować systemowo (--system)

# ── Własny menedżer (przykład) ────────────────────────────────────────────────
# Wystarczy wpisać polecenia; dane katalogu mają format TSV:
#   identyfikator<TAB>nazwa<TAB>wersja<TAB>opis
# `installed_cmd`: identyfikator<TAB>wersja
# `updates_cmd`:   identyfikator<TAB>nowa_wersja
#
# [repository.void]
# name = Void Linux
# backend = custom
# probe = xbps-query
# enabled = auto
# catalog_cmd = sh -c 'xbps-query -s "" | sed ...'
# installed_cmd = sh -c 'xbps-query -l | awk ...'
# install_cmd = pkexec xbps-install -y {package}
# remove_cmd = pkexec xbps-remove -y {package}
# update_all_cmd = pkexec xbps-install -Su
